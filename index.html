<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAMA APP STORE</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #050505, #111111);
            color: #00ff66;
            font-family: 'Tahoma', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 102, 0.3);
            padding: 40px 25px;
            border-radius: 20px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 0 35px rgba(0, 255, 102, 0.2);
            text-align: center;
        }
        h1 { font-size: 24px; margin-bottom: 12px; color: #fff; text-shadow: 0 0 15px rgba(0, 255, 102, 0.6); }
        p { font-size: 14px; color: #aaa; margin-bottom: 25px; line-height: 1.6; }
        .platform-btn {
            display: block;
            color: white;
            padding: 16px;
            margin: 15px 0;
            text-decoration: none;
            font-weight: bold;
            border-radius: 14px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .ios-btn { background: linear-gradient(135deg, #ff0055, #ff5500); box-shadow: 0 5px 20px rgba(255, 0, 85, 0.3); }
        .android-btn { background: linear-gradient(135deg, #00bfff, #0077ff); box-shadow: 0 5px 20px rgba(0, 191, 255, 0.3); }
        .platform-btn:hover { transform: translateY(-3px); }
    </style>
</head>
<body>
    <div class="container">
        <h1>بەخێر بێیت بۆ HAMA APP STORE</h1>
        <p>دروسکراوی چەناڵی <br><strong style="color: #00ff66; font-size: 16px;">HAMA⚡️ViP</strong><br><br><span style="direction: rtl; unicode-bidi: bidi-override; display: inline-block;">تکایە سیستەمی مۆبایلەکەت هەڵبژێرە 👇🏼</span></p>

        <a href="iphone.html" class="platform-btn ios-btn">iPhone IOS 📱</a>
        <a href="android.html" class="platform-btn android-btn">ANDROID 🤖</a>
    </div>
</body>
</html>

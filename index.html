<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAMA APP STORE</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: linear-gradient(135deg, #0f172a, #1e1b4b); 
            color: #f8fafc; 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container { 
            width: 100%; 
            max-width: 450px; 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(12px);
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            text-align: center;
        }
        h1 { 
            color: #38bdf8; 
            margin-bottom: 5px; 
            font-size: 28px; 
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }
        p.subtitle { 
            color: #94a3b8; 
            margin-bottom: 25px; 
            font-size: 15px; 
        }
        .platform-select {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        .platform-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            color: white;
            background: #334155;
            border: 1px solid #475569;
        }
        .platform-btn.active {
            background: #0ea5e9;
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.4);
        }
        .section-content {
            display: none;
            animation: fadeIn 0.4s ease;
        }
        .section-content.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .app-card { 
            background: rgba(15, 23, 42, 0.6); 
            padding: 18px; 
            border-radius: 14px; 
            margin-top: 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            text-align: right;
        }
        .app-info strong { font-size: 16px; color: #f1f5f9; }
        .app-info small { color: #94a3b8; display: block; margin-top: 4px; }
        .btn-download { 
            background: #10b981; 
            padding: 10px 20px; 
            color: white; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 14px; 
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        .btn-download:hover { background: #059669; }
    </style>
</head>
<body>

    <div class="container">
        <h1>HAMA APP STORE</h1>
        <p class="subtitle">فەرموون یەکێک لە سیستەمەکان هەڵبژێرە</p>

        <!-- دوگمەکانی هەڵبژاردنی سیستەم -->
        <div class="platform-select">
            <button class="platform-btn active" onclick="switchTab('ios', this)">iPhone iOS 📱</button>
            <button class="platform-btn" onclick="switchTab('android', this)">ANDROID 🤖</button>
        </div>

        <!-- بەشی ئایفۆن -->
        <div id="ios-section" class="section-content active">
            <div class="app-card">
                <div class="app-info">
                    <strong>ناوی ئەپەکەت (بۆ ئایفۆن)</strong>
                    <small>ڤێرژن: v1.0</small>
                </div>
                <a href="لێرە_لینکی_ئایفۆن_دابنە" class="btn-download" target="_blank">داگرتن</a>
            </div>
        </div>

        <!-- بەشی ئەندرۆید -->
        <div id="android-section" class="section-content">
            <div class="app-card">
                <div class="app-info">
                    <strong>ناوی ئەپەکەت (بۆ ئەندرۆید)</strong>
                    <small>ڤێرژن: v1.0</small>
                </div>
                <a href="لێرە_لینکی_ئەندرۆید_دابنە" class="btn-download" target="_blank">داگرتن</a>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab, btn) {
            document.querySelectorAll('.section-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.platform-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tab + '-section').classList.add('active');
            btn.classList.add('active');
        }
    </script>
</body>
</html>

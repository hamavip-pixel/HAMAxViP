<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAMA APP STORE</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h1 { color: #38bdf8; text-align: center; margin-bottom: 5px; font-size: 26px; }
        p.subtitle { text-align: center; color: #94a3b8; margin-top: 0; margin-bottom: 25px; font-size: 14px; }
        .app-card { background: #334155; padding: 15px; border-radius: 8px; margin-top: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #475569; }
        .app-info strong { font-size: 16px; color: #f1f5f9; }
        .app-info small { color: #94a3b8; display: block; margin-top: 4px; }
        .btn-download { background: #10b981; padding: 10px 18px; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 14px; }
        .btn-download:hover { background: #059669; }
    </style>
</head>
<body>
    <div class="container">
        <h1>HAMA APP STORE</h1>
        <p class="subtitle">فەرموون ئەپە تایبەتەکان دابەزێنن</p>

        <div class="app-card">
            <div class="app-info">
                <strong>ناوی ئەپەکەت</strong>
                <small>ڤێرژن: v1.0</small>
            </div>
            <a href="https://example.com/app.apk" class="btn-download" target="_blank">داگرتن</a>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAMA APP STORE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #050505, #111111);
            color: #00ff66;
            font-family: 'Tahoma', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 102, 0.3);
            padding: 40px 25px;
            border-radius: 20px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 0 35px rgba(0, 255, 102, 0.2);
            text-align: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #fff;
            text-shadow: 0 0 15px rgba(0, 255, 102, 0.6);
            letter-spacing: 1px;
        }
        p {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .action-btn {
            display: block;
            background: linear-gradient(135deg, #00ff66, #00cc52);
            color: #000;
            padding: 16px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 12px;
            font-size: 16px;
            box-shadow: 0 5px 20px rgba(0, 255, 102, 0.3);
            transition: all 0.3s ease;
        }
        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 255, 102, 0.5);
        }
        .platforms-box {
            display: none;
            margin-top: 20px;
            animation: fadeIn 0.5s ease-in-out;
        }
        .platform-btn {
            display: block;
            background: linear-gradient(135deg, #ff0055, #ff5500);
            color: white;
            padding: 14px;
            margin: 12px 0;
            text-decoration: none;
            font-weight: bold;
            border-radius: 12px;
            font-size: 15px;
            box-shadow: 0 5px 20px rgba(255, 0, 85, 0.3);
            transition: all 0.3s ease;
        }
        .platform-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 0, 85, 0.5);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="mainContent">
            <h1>بەخێر بێیت بۆ HAMA APP STORE</h1>
            <p>دروسکراوی چەناڵی <br><strong style="color: #00ff66; font-size: 16px;">HAMA⚡️ViP</strong><br><br>وە بۆ بەردەوام بوون دەسبنێ بەم شتەی خوارۆ👇🏼</p>

            <!-- دوگمەی سەرەکی -->
            <a href="javascript:void(0);" onclick="showPlatforms()" class="action-btn">دەسم لێدە بۆ بەردەوام بوون..</a>
        </div>

        <!-- بەشی دوگمەکانی ئایفۆن و ئەندرۆید کە دوای کلیک کردن دەردەکەون -->
        <div id="platformsArea" class="platforms-box">
            <p style="color: #fff; margin-bottom: 15px;">تکایە بۆ نەردەوام بوان سیستەمی مۆبایلەکەت هەڵبژێرە👇🏼:</p>
            <a href="LINKE_IPHONE_DANE" target="_blank" class="platform-btn">iPhone IOS 📱</a>
            <a href="LINKE_ANDROID_DANE" target="_blank" class="platform-btn">ANDROID 🤖</a>
        </div>
    </div>

    <script>
        function showPlatforms() {
            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('platformsArea').style.display = 'block';
        }
    </script>

</body>
</html>
